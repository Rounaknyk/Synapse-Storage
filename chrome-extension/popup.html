<!DOCTYPE html>
<html>
<head>
    <title>Synapse Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 300px;
            height: 400px;
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2e 100%);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            width: 80%;
            padding: 24px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            color: #9CA3AF;
        }

        input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #60A5FA;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3B82F6 0%, #8B5CF6 100%);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            margin-top: 8px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error {
            color: #EF4444;
            font-size: 12px;
            text-align: center;
            min-height: 15px;
        }

        #loggedInView {
            display: none;
            text-align: center;
        }

        #loginView {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .user-email {
            font-size: 14px;
            color: #D1D5DB;
            margin-bottom: 20px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login View -->
        <div id="loginView">
            <h2>Synapse Storage</h2>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <div class="error" id="errorMsg"></div>
            <button id="loginBtn">Log In</button>
        </div>

        <!-- Logged In View -->
        <div id="loggedInView">
            <h2>Connected</h2>
            <p class="user-email" id="userEmailDisplay"></p>
            <p style="font-size: 12px; color: #9CA3AF; margin-bottom: 20px;">
                You can now use the Synapse widget on any website.
            </p>
            <button id="logoutBtn" style="background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #FCA5A5;">
                Disconnect
            </button>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
